<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Qlik Sense Mashup (Corrected)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 1. Load Qlik Styles (CRITICAL: This was missing) -->
  <link rel="stylesheet" href="https://uk-qlik-sharedinsight-dev.uk.hsbc/resources/autogenerated/qlik-styles.css">

  <!-- 2. RequireJS -->
  <script src="https://uk-qlik-sharedinsight-dev.uk.hsbc/resources/assets/external/requirejs/require.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    /* Ensure the container explicitly has height */
    #qlik-object {
      width: 100%;
      height: 600px;
      border: 1px solid #ccc; /* Border helps to see if the div exists */
      position: relative;
    }
  </style>
</head>

<body>

  <h2>Embedded Qlik Object</h2>
  
  <!-- Error Container to show messages on screen -->
  <div id="error-log" style="color: red; background: #ffe6e6; padding: 10px; display: none;"></div>

  <div id="qlik-object"></div>

  <script>
    const config = {
      host: "uk-qlik-sharedinsight-dev.uk.hsbc",
      prefix: "/",
      port: 443,
      isSecure: true
    };

    require.config({
      baseUrl: (config.isSecure ? "https://" : "http://") + config.host + (config.port ? ":" + config.port : "") + config.prefix + "resources"
    });

    require(["js/qlik"], function (qlik) {
      
      // Global error handling
      qlik.setOnError(function (error) {
        console.error("Qlik Error:", error);
        document.getElementById("error-log").style.display = "block";
        document.getElementById("error-log").innerText = "Error: " + error.message;
      });

      // Open the App
      const app = qlik.openApp("73bfe3db-362d-47c9-b1aa-fd9401e6f15b", config);

      // Get the Object
      app.getObject("qlik-object", "97cf6ee0-9c82-4aee-bca5-e182f2ca4352").then(function(model) {
          console.log("Object loaded successfully");
      }).catch(function(err) {
          console.error("Failed to load object:", err);
      });

    });
  </script>

</body>
</html>

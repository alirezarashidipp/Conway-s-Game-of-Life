<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Qlik Sense Mashup (Debug Mode)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 1. Load Qlik Styles -->
  <link rel="stylesheet" href="https://uk-qlik-sharedinsight-dev.uk.hsbc/resources/autogenerated/qlik-styles.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    
    /* Tip box for authentication */
    .auth-tip {
      background-color: #fff3cd;
      color: #856404;
      border: 1px solid #ffeeba;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 4px;
      font-size: 14px;
    }

    #qlik-object {
      width: 100%;
      height: 600px;
      border: 1px solid #ccc;
      position: relative;
    }
    
    .error-box {
      color: #721c24;
      background-color: #f8d7da;
      border: 1px solid #f5c6cb;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 4px;
      display: none; /* Hidden by default */
    }
  </style>
</head>

<body>

  <h2>Embedded Qlik Object</h2>

  <!-- Authentication Reminder -->
  <div class="auth-tip">
    <strong>مهم:</strong> اگر خطای <code>TargetId</code> یا <code>400 BadRequest</code> می‌بینید، لطفاً در یک تب دیگر همین مرورگر به آدرس 
    <a href="https://uk-qlik-sharedinsight-dev.uk.hsbc/hub" target="_blank">Qlik Hub</a> بروید و لاگین کنید، سپس این صفحه را رفرش کنید.
  </div>
  
  <!-- Error Container -->
  <div id="error-log" class="error-box"></div>

  <div id="qlik-object"></div>

  <!-- 2. RequireJS with Error Handling -->
  <script 
    src="https://uk-qlik-sharedinsight-dev.uk.hsbc/resources/assets/external/requirejs/require.js"
    onerror="handleScriptError()"
  ></script>

  <script>
    function handleScriptError() {
      const errDiv = document.getElementById("error-log");
      errDiv.style.display = "block";
      errDiv.innerHTML = "<strong>CRITICAL ERROR:</strong> Failed to load 'require.js' from the Qlik Server.<br><br>" + 
                         "Possible causes:<br>" +
                         "1. <strong>CORS Issue:</strong> The server blocks 'localhost'. Check console (F12) for red CORS errors.<br>" +
                         "2. <strong>VPN/Network:</strong> You are not connected to the HSBC network.<br>" +
                         "3. <strong>Wrong URL:</strong> The path to resources is incorrect.";
    }

    // Only proceed if RequireJS loaded successfully
    if (typeof require !== 'undefined') {
      const config = {
        host: "uk-qlik-sharedinsight-dev.uk.hsbc",
        prefix: "/",
        port: 443,
        isSecure: true
      };

      require.config({
        baseUrl: (config.isSecure ? "https://" : "http://") + config.host + (config.port ? ":" + config.port : "") + config.prefix + "resources"
      });

      require(["js/qlik"], function (qlik) {
        
        // Qlik internal error handling
        qlik.setOnError(function (error) {
          console.error("Qlik Error:", error);
          const errDiv = document.getElementById("error-log");
          errDiv.style.display = "block";
          
          // Custom message for the TargetId/Proxy error
          if (error.message && (error.message.includes("Proxy") || error.message.includes("400"))) {
             errDiv.innerHTML = "<strong>Authentication Error:</strong><br>Please open a new tab, log in to the Qlik Hub, and then refresh this page.";
          } else {
             errDiv.innerText = "Qlik Internal Error: " + error.message;
          }
        });

        // Open App
        const app = qlik.openApp("73bfe3db-362d-47c9-b1aa-fd9401e6f15b", config);

        // Get Object
        app.getObject("qlik-object", "97cf6ee0-9c82-4aee-bca5-e182f2ca4352")
           .then(() => console.log("Object loaded"))
           .catch(err => console.error("GetObject Error:", err));

      }, function(err) {
          // RequireJS module loading error
          const errDiv = document.getElementById("error-log");
          errDiv.style.display = "block";
          errDiv.innerHTML = "<strong>RequireJS Error:</strong> Failed to load Qlik modules.<br>" + 
                             "Check the Console (F12). If you see 'import-map' errors or 'CORS', your server does not allow localhost access.";
          console.error("RequireJS Err:", err);
      });
    }
  </script>

</body>
</html>
